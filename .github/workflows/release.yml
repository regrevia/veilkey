name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path 'Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'packaging/output' | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$((Get-Location).Path)" "/DBinaryPath=$((Get-Location).Path)\target\x86_64-pc-windows-msvc\release\veilkey.exe" 'packaging/windows/veilkey.iss'
          Copy-Item 'target/x86_64-pc-windows-msvc/release/veilkey.exe' 'packaging/output/VeilKey.exe'
          $portableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'packaging/output/VeilKey.exe').Hash
          $installedSourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'target/x86_64-pc-windows-msvc/release/veilkey.exe').Hash
          if ($portableHash -ne $installedSourceHash) { throw 'Portable executable differs from the release build.' }
          $installer = Get-Item 'packaging/output/VeilKey-Setup.exe'
          .\packaging\windows\smoke-test-installer.ps1 -InstallerPath $installer.FullName -ExpectedExecutableSha256 $portableHash
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/output/VeilKey.exe
            packaging/output/VeilKey-Setup.exe

  macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Build app bundle
        run: bash packaging/macos/build-app.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}" packaging/output
      - uses: softprops/action-gh-release@v2
        with:
          files: packaging/output/VeilKey-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip
