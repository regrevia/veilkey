name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64.exe
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/veilkey${{ endsWith(matrix.suffix, '.exe') && '.exe' || '' }}" "veilkey-${{ matrix.suffix }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: veilkey-${{ matrix.suffix }}
