[package]
name = "veilkey"
version = "0.2.4"
edition = "2024"
license = "MIT"
description = "Group desktop windows and toggle them together with a shortcut."

[dependencies]
eframe = "0.31"
fs2 = "0.4"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation-sys = "0.8"




