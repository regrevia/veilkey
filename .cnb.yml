main:
  push:
    - name: macos-arm64-check
      lock:
        key: veilkey-macos-arm64
        cancel-in-progress: true
      runner:
        namespace: group
        tags:
          - mac
          - arm64
      env:
        RUSTUP_TOOLCHAIN: stable
        PATH: /Users/apple/.cargo/bin:/Users/apple/.local/opt/node-current/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      stages:
        - name: check
          script: cargo check --all-targets
